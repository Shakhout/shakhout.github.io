<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found — MD Shakhout Hossain</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#050505">
    <link rel="icon" href="/assets/img/favicon.svg?v=2" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/assets/css/main.css">
    <style>
        .not-found {
            display: grid;
            place-content: center;
            gap: 24px;
            min-height: 100vh;
            min-height: 100svh;
            text-align: center;
        }

        .not-found__code {
            font-size: clamp(6rem, 25vw, 14rem);
            font-weight: 700;
            line-height: .9;
            letter-spacing: -.06em;
            color: transparent;
            -webkit-text-stroke: 1.5px var(--accent);
        }
    </style>
</head>
<body>
    <main class="not-found container">
        <p class="not-found__code" aria-hidden="true">404</p>
        <h1 class="section__title">This page doesn't exist.</h1>
        <p class="mono text-muted">$ cd ~ &amp;&amp; try again</p>
        <p><a class="btn btn--primary" href="/">Back to the homepage</a></p>
    </main>
</body>
</html>
